[project]
name = "backlot"
version = "0.1.0"
description = "Agent-driven video production studio CLI (vault + project dir + providers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "fal-client>=0.5",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
backlot = "backlot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backlot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
